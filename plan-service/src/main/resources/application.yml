spring:
  application:
    name: plan-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:rehabdb}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:1234}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

server:
  port: ${SERVER_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:prometheus,health,info}
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
      transport: ${OTEL_EXPORTER_OTLP_PROTOCOL:grpc}

patient:
  service:
    url: ${PATIENT_SERVICE_URL:http://patient-service:8087}
    timeout-ms: ${PATIENT_SERVICE_TIMEOUT_MS:3000}
    retry:
      max-attempts: ${PATIENT_SERVICE_RETRY_MAX_ATTEMPTS:3}
      backoff-ms: ${PATIENT_SERVICE_RETRY_BACKOFF_MS:300}
user:
  service:
    url: ${USER_SERVICE_URL:http://user-service:8082}
    timeout-ms: ${USER_SERVICE_TIMEOUT_MS:3000}
    retry:
      max-attempts: ${USER_SERVICE_RETRY_MAX_ATTEMPTS:3}
      backoff-ms: ${USER_SERVICE_RETRY_BACKOFF_MS:300}

logging:
  level:
    com.rehabai.plan_service: DEBUG
  request-body:
    enabled: ${REQUEST_BODY_LOGGING_ENABLED:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    syntax-highlight:
      activated: true
    display-request-duration: true
    doc-expansion: none
  show-actuator: false
